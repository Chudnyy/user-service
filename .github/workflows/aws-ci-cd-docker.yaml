name: AWS CI/CD Docker

on: push

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      artifact-name-prefix: ${{ steps.artifact-name-prefix.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/generate-filename-prefix
        id: artifact-name-prefix

  test:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle-env

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup.outputs.artifact-name-prefix }}-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

  deploy:
    needs: [setup, test]
    runs-on: ubuntu-latest

    env:
      ERC_REPOSITORY: pet/integration/user-service
      EB_APPLICATION_NAME: user-service
      EB_ENVIRONMENT_NAME: user-service-docker-env
      CONTAINER_PORT: 8080
      AWS_REGION: eu-north-1
      IMAGE_TAG: ${{ needs.setup.outputs.artifact-name-prefix }}
      EB_S3_BUCKET: elasticbeanstalk-{{ env.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: BUILD and Push Docker image to ECR
        id: push-image
        run: |
          IMAGE_PATH=${{ steps.ecr-login.outputs.registry }}/${{ env.ERC_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker build -t $IMAGE_PATH .
          docker push $IMAGE_PATH
          echo "image=$IMAGE_PATH" >> $GITHUB_ENV

      - name: Create Dockerrun.aws.json
        run: |
          echo '{
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "'${{ env.image }}'"
            },
            "Ports": [
              {
                "ContainerPort": "'${{ env.CONTAINER_PORT }}'"
              }
            ]
          }' > Dockerrun.aws.json

      - name: Create ZIP package for Elastic Beanstalk
        run: zip -r deploy.zip Dockerrun.aws.json

      - name: Create ZIP package to S3
        run: |
          FILE_PATH=${{ env.EB_APPLICATION_NAME }}/deployment-package-${{ env.IMAGE_TAG }}.zip
          aws s3 cp deploy.zip s3://${{ env.EB_S3_BUCKET }}/$FILE_PATH
          echo "s3-path=$FILE_PATH" >> $GITHUB_ENV

      - name: Create new application version in Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ env.IMAGE_TAG }} \
            --source-bundle S3Bucket=${{ env.EB_S3_BUCKET }},S3Key=${{ env.s3-path }}

      - name: Update ElasticBeanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
              --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
              --version-label ${{ env.IMAGE_TAG }}

      - name: Wait for deployment to complete
        id: wait-deployment
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=30
          ATTEMPT=0
          POLL_INTERVAL=10

          echo "⏳ Waiting for deployment to complete (max ${MAX_ATTEMPTS} attempts, polling every ${POLL_INTERVAL}s)..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            # Get environment status
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
              --query 'Environments[0].Status' \
              --output text)

            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
              --query 'Environments[0].Health' \
              --output text)

            echo "[$ATTEMPT/$MAX_ATTEMPTS] Status: $STATUS | Health: $HEALTH"

            # Terminal states: Ready, Terminated, Terminating
            if [[ "$STATUS" == "Ready" ]]; then
              echo "✅ Deployment completed successfully!"
              echo "DEPLOYMENT_STATUS=SUCCESS" >> $GITHUB_ENV
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [[ "$STATUS" == "Terminated" || "$STATUS" == "Terminating" ]]; then
              echo "❌ Environment is $STATUS"
              echo "DEPLOYMENT_STATUS=FAILED" >> $GITHUB_ENV
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi

            # Wait before next poll
            sleep $POLL_INTERVAL
          done

          echo "❌ Deployment timed out after ${MAX_ATTEMPTS} attempts"
          echo "DEPLOYMENT_STATUS=TIMEOUT" >> $GITHUB_ENV
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Show deployment status
        if: always()
        run: |
          echo "📊 Final Deployment Status: ${{ env.DEPLOYMENT_STATUS }}"
          echo "Step output status: ${{ steps.wait-deployment.outputs.status }}"