name: AWS CI/CD Docker

env:
  S3_BUILD_DIR: "user-service"
  EB_PORT: 8080
  EB_S3_BUCKET: s3-integration-builds
  AWS_REGION: eu-north-1

on: push

permissions:
  contents: read
  id-token: write

jobs:
#  infra:
#    permissions:
#      id-token: write
#      contents: read
#    uses: ./.github/workflows/terraform.yaml
#    secrets: inherit

  setup:
    runs-on: ubuntu-latest
    outputs:
      artifact-name-prefix: ${{ steps.artifact-name-prefix.outputs.name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/generate-filename-prefix
        id: artifact-name-prefix

  test:
    needs: setup
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: ci-test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle-env

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup.outputs.artifact-name-prefix }}-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

