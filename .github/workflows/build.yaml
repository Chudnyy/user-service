name: Build and Test JAR

on:
  push:
  pull_request:

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build --no-daemon --console=plain

      - name: Prepare artifact filename
        shell: bash
        run: |
          # Short SHA, sanitize branch name (replace / with -)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BRANCH=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          FILE="${GITHUB_RUN_NUMBER}-${SHORT_SHA}-${BRANCH}"
          echo "ARTIFACT_NAME=$FILE" >> $GITHUB_ENV

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

      - name: Prepare artifact filename and copy JAR
        shell: bash
        run: |
          mkdir -p artifacts
          # pick a jar (adjust grep if needed)
          SRC=$(ls build/libs/*.jar | grep -v '\-plain\.jar$' | head -n1)
          if [ -z "$SRC" ]; then
            echo "No JAR found in build/libs"
            exit 1
          fi
          cp "$SRC" "artifacts/${ARTIFACT_NAME}.jar"
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}

      - name: Upload renamed JAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.jar