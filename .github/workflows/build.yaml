name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build --no-daemon --console=plain

      - name: Prepare artifact filename
        shell: bash
        run: |
          # Short SHA, sanitize branch name (replace / with -)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BRANCH=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          FILE="${GITHUB_RUN_NUMBER}-${SHORT_SHA}-${BRANCH}"
          echo "ARTIFACT_NAME=$FILE" >> $GITHUB_ENV

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: build/libs/