spring:
  datasource:
    url: jdbc:tc:postgresql:latest:///test
    default-schema: USR

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: "\"USR\""
    default-schema: USR

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgres
    baseline-on-migrate: true
    default-schema: USR